services:
  gruppe11-beredskap:
    image: gruppe11-beredskap
    build:
      context: .
      dockerfile: gruppe11-beredskap/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${MARIADB_DATABASE:-beredskapdb};User=${MARIADB_USER:-beredskap};Password=${MARIADB_PASSWORD:-gruppe11}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-gruppe11}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-beredskapdb}
      MARIADB_USER: ${MARIADB_USER:-beredskap}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-gruppe11}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
